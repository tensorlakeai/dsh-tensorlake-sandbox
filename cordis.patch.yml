# Replace the host execution providers with one shared Tensorlake microVM.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: true

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: true

# Host confinement is unnecessary for processes and files already isolated by
# the microVM. Advertise danger-full-access within that remote boundary so the
# sandbox-aware Bash executor delegates directly to the Tensorlake subprocess
# provider while remaining compatible with Harness permission presets.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.DSH_TENSORLAKE_CWD || '/home/tl-user/workspace'

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: false

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

# Restricted host-filesystem modes cannot describe the microVM boundary. Keep
# the selectable permission surface honest by exposing only its full-access
# mode, paired with the no-prompt approval policy above.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

- insert:
    - id: tensorlake-runtime
      name: '@tensorlake/dsh-sandbox/runtime'
      config:
        cwd: !!js process.env.DSH_TENSORLAKE_CWD || '/home/tl-user/workspace'

    - id: tensorlake-subprocess
      name: '@tensorlake/dsh-sandbox/subprocess'

    - id: tensorlake-filesystem
      name: '@tensorlake/dsh-sandbox/filesystem'
